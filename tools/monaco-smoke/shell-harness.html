<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monaco shell harness</title>
  <link rel="stylesheet" href="../../src/renderer/styles.css">
  <link rel="stylesheet" href="../../src/renderer/editor/editor-host.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .h { padding: 8px; background: #252526; color: #9cdcfe; font: 13px sans-serif; }
    .editor-area { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .editor-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  </style>
</head>
<body class="app-container">
  <div class="h">Shell harness — iframe Monaco + VIBE styles.css. Scroll must match plain smoke.</div>
  <div class="editor-area">
    <div class="editor-content">
      <div class="editor-pane-viewport" id="editorPaneViewport">
        <div id="monacoEditor" class="editor-pane editor-pane-active"></div>
      </div>
    </div>
  </div>
  <script>
    window.nodeRequire = require;
    const iframe = document.createElement('iframe');
    iframe.className = 'vibe-monaco-frame';
    iframe.src = '../../src/renderer/editor/monaco-frame.html';
    iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
    document.getElementById('monacoEditor').appendChild(iframe);
    iframe.addEventListener('load', () => {
      const api = iframe.contentWindow.__vibeMonaco;
      api.whenReady().then(() => {
        const sample = Array.from({ length: 200 }, (_, i) =>
          `.rule-${i} { padding: ${i % 4}px; }`
        ).join('\n');
        api.createEditor('/* shell harness */\n' + sample, 'css', 'dark');
      });
    });
  </script>
</body>
</html>
